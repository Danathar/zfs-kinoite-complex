name: Build Native Image

description: Build the native Kinoite image with the standard OCI build arguments used by this repository.

inputs:
  image_name:
    description: Local image name to hand to buildah.
    required: true
  image_tag:
    description: Local image tag to build.
    required: true
  base_image:
    description: Digest-pinned base image ref.
    required: true
  akmods_image:
    description: Shared akmods cache image ref.
    required: true
  brew_image:
    description: Digest-pinned Homebrew payload image ref.
    required: true
  akmods_upstream_ref:
    description: Resolved akmods fork commit SHA used for this build. Recorded as an OCI image label for provenance.
    required: false
    default: ""
  stable_signal_image:
    description: Upstream stable-signal image ref recorded as OCI image provenance.
    required: false
    default: ""
  stable_signal_digest:
    description: Upstream stable-signal digest recorded as OCI image provenance.
    required: false
    default: ""
  zfs_version:
    description: Exact resolved OpenZFS patch version installed by this build. Recorded as an OCI image label for provenance.
    required: false
    default: ""
  kernel_held_from:
    description: >-
      The newest base image's kernel when input resolution held this build on
      an older base because OpenZFS does not support that kernel yet; empty
      otherwise. Recorded as an OCI image label, so a published image says it
      is held, and the scheduled gate and promotion read it back.
    required: false
    default: ""
  registry_username:
    description: >-
      Registry user used only to read the base image when it is this
      repository's private held-base copy. Unused for any other base.
    required: false
    default: ""
  registry_password:
    description: >-
      Registry token used only to read the base image when it is this
      repository's private held-base copy. Unused for any other base.
    required: false
    default: ""
  image_repo:
    description: Public image repository path used by in-image signing policy.
    required: true
  signing_key_filename:
    description: Public key filename installed inside the image.
    required: true

runs:
  # A "composite action" is a reusable set of workflow steps stored in this
  # repository. It lets the workflow say "build the image" once, without
  # copying the same Buildah settings into several workflow files.
  using: composite
  steps:
    - name: Show pinned akmods cache input
      shell: bash
      run: |
        echo "Final image build will consume akmods cache image: ${INPUTS_AKMODS_IMAGE}"
      env:
        INPUTS_AKMODS_IMAGE: ${{ inputs.akmods_image }}

    # Buildah is the Open Container Initiative (OCI) image builder used by this
    # repository. We call it directly (rather than through a wrapper action) so
    # every build input is one explicit flag readers can see, and so this step
    # does not depend on a third-party action's release cadence. buildah ships
    # preinstalled on the GitHub-hosted runner this job uses.
    - name: Build image with buildah
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        BASE_IMAGE: ${{ inputs.base_image }}
        AKMODS_IMAGE: ${{ inputs.akmods_image }}
        BREW_IMAGE: ${{ inputs.brew_image }}
        IMAGE_REPO: ${{ inputs.image_repo }}
        SIGNING_KEY_FILENAME: ${{ inputs.signing_key_filename }}
        # Recorded as OCI image labels below, as provenance for the run.
        #
        # AKMODS_UPSTREAM_REF is the akmods fork commit this run *resolved*,
        # which is only the commit that built the shipped modules when this run
        # actually rebuilt the akmods cache. On a cache-reuse build the cache
        # may predate the current tracking ref, so this label can name a commit
        # that never touched the modules in the image. Do not treat it as proof
        # of module provenance; org.zfs-kinoite-complex.akmods-image (the
        # verified digest of the cache actually consumed) is the reliable one.
        # See docs/akmods-fork-maintenance.md for the full caveat.
        AKMODS_UPSTREAM_REF: ${{ inputs.akmods_upstream_ref }}
        STABLE_SIGNAL_IMAGE: ${{ inputs.stable_signal_image }}
        STABLE_SIGNAL_DIGEST: ${{ inputs.stable_signal_digest }}
        ZFS_VERSION: ${{ inputs.zfs_version }}
        KERNEL_HELD_FROM: ${{ inputs.kernel_held_from }}
        # Read only for a base that is this repository's private held-base
        # copy (see the check below). Upstream bases are always pulled
        # anonymously, so the token never goes to quay.io.
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
      run: |
        set -euo pipefail
        # A held build whose upstream base is gone builds `FROM` this
        # repository's copy in the zfs-kinoite-complex-held-base package. That
        # package is private, so buildah needs an auth file for it. The token
        # goes into a 0600 file in a fresh directory, never into argv, and
        # only for a base in that package (ci_tools.resolve_build_inputs
        # HELD_BASE_PACKAGE); any other base is pulled anonymously.
        auth_args=()
        if [[ "${BASE_IMAGE}" == "${IMAGE_REPO%/*}/zfs-kinoite-complex-held-base@"* ]]; then
          if [[ -z "${REGISTRY_USERNAME}" || -z "${REGISTRY_PASSWORD}" ]]; then
            echo "The base image ${BASE_IMAGE} is this repository's private held-base copy, but no registry credential was passed to read it." >&2
            exit 1
          fi
          umask 077
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "${auth_dir}"' EXIT
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "${REGISTRY_USERNAME}" "${REGISTRY_PASSWORD}" | base64 -w0)" \
            > "${auth_dir}/config.json"
          auth_args=(--authfile "${auth_dir}/config.json")
        fi
        # --format docker (rather than buildah's oci default) writes this local
        # image with a Docker v2s2 manifest. The reason recorded for it is that
        # host update tooling (`bootc upgrade` on booted machines) works more
        # reliably with the Docker format, but it does not decide what those
        # machines receive: rechunk-native-image replaces this image with one
        # loaded from an OCI archive, so published images have an OCI manifest.
        buildah build \
          --tls-verify=true \
          "${auth_args[@]}" \
          --format docker \
          -f ./Containerfile \
          --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
          --build-arg "AKMODS_IMAGE=${AKMODS_IMAGE}" \
          --build-arg "BREW_IMAGE=${BREW_IMAGE}" \
          --build-arg "IMAGE_REPO=${IMAGE_REPO}" \
          --build-arg "SIGNING_KEY_FILENAME=${SIGNING_KEY_FILENAME}" \
          --label "org.zfs-kinoite-complex.akmods-ref=${AKMODS_UPSTREAM_REF}" \
          --label "org.zfs-kinoite-complex.akmods-image=${AKMODS_IMAGE}" \
          --label "org.zfs-kinoite-complex.base-image=${BASE_IMAGE}" \
          --label "org.zfs-kinoite-complex.brew-image=${BREW_IMAGE}" \
          --label "org.zfs-kinoite-complex.stable-signal-image=${STABLE_SIGNAL_IMAGE}" \
          --label "org.zfs-kinoite-complex.stable-signal-digest=${STABLE_SIGNAL_DIGEST}" \
          --label "org.zfs-kinoite-complex.zfs-version=${ZFS_VERSION}" \
          --label "org.zfs-kinoite-complex.kernel-held-from=${KERNEL_HELD_FROM}" \
          -t "${IMAGE_NAME}:${IMAGE_TAG}" \
          .
