name: Build Branch Image

# This workflow validates normal development branches. It proves that the
# branch can still resolve inputs, reuse the shared ZFS module cache, and
# compose a working image before anything lands on `main`. Branch runs are
# deliberately read-only against shared production state: they never rebuild
# the shared akmods cache and never sign anything -- the production signing key
# lives in a `main`-restricted environment they cannot reach. Human-authored
# branches publish UNSIGNED `br-*` test images for throwaway VMs only.
#
# `ai-fix/**` is excluded on purpose. Those branches are pushed by the agent in
# ai-fix.yml, and publishing a registry tag -- even an unsigned throwaway one --
# is more than opening a pull request should cost. Nothing is lost: build-pr.yml
# still validates the pull request the agent opens, and it publishes nothing. So
# an agent branch produces no artifact at all, which is what
# docs/SECURITY-AI.md's "What an agent branch can actually cause here" says.
# tests/test_workflow_build_container.py pins this, because it is one line and
# would be easy to drop while editing the trigger for an unrelated reason.
on:
  push:
    branches-ignore:
      - main
      - 'ai-fix/**'
    paths-ignore:
      - README.md
      - "**/README.md"
      - docs/**
      - "**/*.md"
  workflow_dispatch:

concurrency:
  # Only keep the newest run for a branch. If several commits land quickly, the
  # older run is no longer interesting and should not keep consuming time.
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare-branch-metadata:
    name: Compute Branch Tag
    # Tag computation only; observed under 1m.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      branch_tag: ${{ steps.branch.outputs.branch_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Branch names can contain slashes and other characters that do not make
      # good image tags. This step turns the Git branch name into a safe prefix
      # that can be used in the registry.
      - name: Compute branch-safe image tag prefix
        id: branch
        shell: bash
        run: |
          python3 -m ci_tools.cli compute-branch-metadata

  build-branch-akmods:
    name: Verify Shared ZFS Akmods Cache
    # Read-only: resolves inputs and checks the shared cache, never rebuilds it.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    outputs:
      fedora_version: ${{ steps.prepare.outputs.version }}
      kernel_release: ${{ steps.prepare.outputs.kernel_release }}
      detected_kernel_releases: ${{ steps.prepare.outputs.detected_kernel_releases }}
      base_image_ref: ${{ steps.prepare.outputs.base_image_ref }}
      base_image_name: ${{ steps.prepare.outputs.base_image_name }}
      base_image_tag: ${{ steps.prepare.outputs.base_image_tag }}
      base_image_pinned: ${{ steps.prepare.outputs.base_image_pinned }}
      base_image_digest: ${{ steps.prepare.outputs.base_image_digest }}
      build_container_ref: ${{ steps.prepare.outputs.build_container_ref }}
      build_container_pinned: ${{ steps.prepare.outputs.build_container_pinned }}
      build_container_digest: ${{ steps.prepare.outputs.build_container_digest }}
      brew_image_pinned: ${{ steps.prepare.outputs.brew_image_pinned }}
      zfs_minor_version: ${{ steps.prepare.outputs.zfs_minor_version }}
      zfs_version: ${{ steps.prepare.outputs.zfs_version }}
      akmods_upstream_ref: ${{ steps.prepare.outputs.akmods_upstream_ref }}
      use_input_lock: ${{ steps.prepare.outputs.use_input_lock }}
      lock_file_path: ${{ steps.prepare.outputs.lock_file_path }}
      akmods_image: ${{ steps.prepare.outputs.akmods_image }}
      akmods_image_pinned: ${{ steps.prepare.outputs.akmods_image_pinned }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same order as build-pr.yml. prepare-validation-build pulls the base image
      # with `podman pull --retry`, which the stock ubuntu-24.04 podman does not
      # have; this action installs the newer podman/skopeo it needs (first branch
      # run without it failed: "unknown flag: --retry", run 36879388503).
      - name: Prepare runner (podman version and disk layout)
        uses: ./.github/actions/prepare-rechunk-host

      - id: defaults
        name: Load repository defaults
        uses: ./.github/actions/load-ci-defaults

      - name: Install skopeo and cosign
        uses: ./.github/actions/install-signing-tools

      # The same read-only preparation build-pr.yml runs. No branch run --
      # human or bot -- may mutate the shared cache that production consumes:
      # this command has no rebuild path at all, and fails with the repair
      # instruction (a main workflow_dispatch with rebuild_akmods=true) when
      # the cache is missing, stale, or unsigned.
      - name: Resolve inputs and verify shared akmods cache
        id: prepare
        shell: bash
        env:
          USE_INPUT_LOCK: false
          LOCK_FILE: ci/inputs.lock.json
          BUILD_CONTAINER_REF: ${{ steps.defaults.outputs.default_build_container_image }}
          AKMODS_REPO: ${{ steps.defaults.outputs.akmods_repo }}
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m ci_tools.cli prepare-validation-build


  build-branch-image:
    name: Build Branch Image
    # Full image build; observed up to 8m.
    timeout-minutes: 60
    needs:
      - prepare-branch-metadata
      - build-branch-akmods
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rechunking briefly needs two copies of the image unpacked at once, so
      # prepare disk space, podman version, and storage layout before the
      # build starts.
      - name: Prepare runner for Chunkah rechunking
        uses: ./.github/actions/prepare-rechunk-host

      # Load the checked-in defaults first so the rest of the workflow can say
      # "use the repository default" without repeating long image references.
      - id: defaults
        name: Load repository defaults
        uses: ./.github/actions/load-ci-defaults

      # Compute the lowercase registry owner and whether the current actor is a
      # bot account. Branch builds for bot actors validate locally only.
      - id: registry
        name: Prepare registry context
        uses: ./.github/actions/prepare-registry-context

      # Add the resolved Fedora version to the branch tag so readers can tell
      # which base-image release the branch build targeted.
      - name: Compose final branch tag
        id: tags
        shell: bash
        env:
          BRANCH_TAG_PREFIX: ${{ needs.prepare-branch-metadata.outputs.branch_tag }}
          FEDORA_VERSION: ${{ needs.build-branch-akmods.outputs.fedora_version }}
        run: |
          python3 -m ci_tools.cli compose-branch-image-tag

      # Build the branch image locally first. This keeps the publication step
      # separate so validation can succeed without pushing anything.
      - name: Build branch image locally
        uses: ./.github/actions/build-native-image
        with:
          image_name: ${{ steps.defaults.outputs.image_name }}
          image_tag: ${{ steps.tags.outputs.branch_image_tag }}
          base_image: ${{ needs.build-branch-akmods.outputs.base_image_pinned }}
          akmods_image: ${{ needs.build-branch-akmods.outputs.akmods_image_pinned }}
          brew_image: ${{ needs.build-branch-akmods.outputs.brew_image_pinned }}
          akmods_upstream_ref: ${{ needs.build-branch-akmods.outputs.akmods_upstream_ref }}
          zfs_version: ${{ needs.build-branch-akmods.outputs.zfs_version }}
          image_repo: ghcr.io/${{ steps.registry.outputs.image_org }}/${{ steps.defaults.outputs.image_name }}
          signing_key_filename: ${{ steps.defaults.outputs.image_name }}.pub

      # Rechunk unconditionally, even for bot-authored branches that will not
      # publish below. That way every branch build exercises the rechunk path
      # before a human-authored branch (or main) relies on it.
      - name: Rechunk branch image with Chunkah
        uses: ./.github/actions/rechunk-native-image
        with:
          image_name: ${{ steps.defaults.outputs.image_name }}
          image_tag: ${{ steps.tags.outputs.branch_image_tag }}

      # Human-owned branches publish an UNSIGNED test image for throwaway VMs.
      # The production signing key is deliberately unreachable from branch refs
      # (main-scoped environment), and this workflow must never reference it --
      # a test asserts that. Consequences, documented in
      # docs/install-and-verify.md: machines enforcing this repository's
      # signature policy refuse to pull br-* tags, such images can only be
      # switched to on fresh VMs with plain `bootc switch`, and a VM tracking
      # one can never be moved into signature enforcement. Test-only, never
      # durable.
      - name: Push unsigned branch test image
        if: steps.registry.outputs.actor_is_bot != 'true'
        uses: ./.github/actions/publish-native-image
        with:
          image_registry: ${{ steps.registry.outputs.image_registry }}
          image_name: ${{ steps.defaults.outputs.image_name }}
          image_tag: ${{ steps.tags.outputs.branch_image_tag }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ github.token }}
          image_org: ${{ steps.registry.outputs.image_org }}
          allow_unsigned: "true"

      # Automated dependency update branches still run the full build, but they
      # stop short of publishing to avoid cluttering the registry with bot-only
      # tags that are not meant for human testing.
      - name: Explain skipped branch publish for bot actor
        if: steps.registry.outputs.actor_is_bot == 'true'
        shell: bash
        run: |
          echo "Actor ${GITHUB_ACTOR} is a bot account, so this workflow validated the branch image locally but did not push or sign it."
