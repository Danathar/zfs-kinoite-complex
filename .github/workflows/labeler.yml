---
name: Labeler

# Applies the descriptive `area/*` labels defined in .github/labeler.yml, so a
# pull request says at a glance which part of the repository it lands in -- and,
# by extension, which risk tier it takes (docs/risk-tiers.md).
#
# `area/safety-critical` is the one that earns this workflow its place. It marks
# a change to one of the seven files AGENTS.md section 0 rule 2 names, which is
# the trigger for the statement CONTRIBUTING requires and docs/review-rubric.md
# treats as blocking if missing. A reviewer should learn that from the pull
# request, not from reading the diff carefully enough to notice.
#
# Two deliberate choices:
#
# `pull_request`, not `pull_request_target`. From 2026-12-02 GitHub stops
# running `pull_request_target` workflows in public repositories unless a
# repository event policy allows them
# (https://github.blog/changelog/2026-11-02-pull_request_target-blocked-by-default-december-2).
# The hive's GitHub App cannot create that policy: its owner refused it the
# Administration permission it would need, for security reasons. The
# alternative is a policy made by hand for each repository. This job never
# needed `pull_request_target` anyway. It only reads the changed-file list
# through the API. Under `pull_request`, a pull request from a branch in this
# repository gets a write token, because `permissions:` below grants
# `pull-requests: write`. That includes Dependabot's: its runs start
# read-only, but GitHub's docs say the `permissions` key can raise that
# ("Changing GITHUB_TOKEN permissions" in the Dependabot-on-Actions
# troubleshooting page).
#
# A pull request from a fork gets a read-only token under `pull_request`, so
# labelling would fail. The job-level `if:` skips it instead: a grey "skipped"
# run, not a red one. None of the last 100 pull requests here came from a
# fork, so this costs nothing in practice.
#
# Under `pull_request` this workflow and .github/labeler.yml are read from the
# pull request's own merge commit, not from main. A pull request can change
# the globs and be labelled by its own copy, for example to avoid
# `area/safety-critical`. That is acceptable: only branches in this repository
# run, their authors already have write access (and could add a workflow of
# their own), and the edit to .github/labeler.yml shows in the diff. That file
# is in `area/ci`, not `area/safety-critical`, and .github/CODEOWNERS does not
# list it. The label is a review cue. The gate on the safety-critical files is
# .github/CODEOWNERS, which GitHub reads from the base branch.
#
# The job never checks out or executes the pull request's code. Adding a
# checkout of the head ref, or any step that runs code from the pull request,
# would put a write token in reach of that code. Bot branches (Renovate,
# Dependabot) carry code written outside this repository. Do not add one.
#
# `sync-labels: false` so the action only ever adds. A label a human attached by
# hand is not removed because no path matches it any more.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply area labels
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply labels from .github/labeler.yml
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
