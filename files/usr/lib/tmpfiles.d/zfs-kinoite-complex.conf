# The `zfs` userspace dependency chain pulls in `pcp`, which seeds these
# directories under `/var` during image composition. Declaring them here keeps
# `bootc container lint` aligned with the final filesystem layout.
# `pcp-conf` owns /var/lib/pcp, config/derived and pmns; `pcp-libs` puts
# symlinks under pmdas/<agent>/ for the agents listed below.
d /var/lib/pcp 0755 root root - -
d /var/lib/pcp/config 0755 root root - -
d /var/lib/pcp/config/derived 0755 root root - -
d /var/lib/pcp/pmns 0755 root root - -
d /var/lib/pcp/pmdas 0755 root root - -
d /var/lib/pcp/pmdas/btrfs 0755 root root - -
d /var/lib/pcp/pmdas/cifs 0755 root root - -
d /var/lib/pcp/pmdas/denki 0755 root root - -
d /var/lib/pcp/pmdas/dm 0755 root root - -
d /var/lib/pcp/pmdas/jbd2 0755 root root - -
d /var/lib/pcp/pmdas/kvm 0755 root root - -
d /var/lib/pcp/pmdas/linux 0755 root root - -
d /var/lib/pcp/pmdas/mmv 0755 root root - -
d /var/lib/pcp/pmdas/pmimport 0755 root root - -
d /var/lib/pcp/pmdas/proc 0755 root root - -
d /var/lib/pcp/pmdas/xfs 0755 root root - -
